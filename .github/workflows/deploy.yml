name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Charges/warranty are fetched from the Oasis backend at build time
      # (src/lib/config.js); on a timeout the shipped defaults are used.
      # The site lives on its own domain, so the URL is pinned here rather than
      # read from configure-pages. That output follows the Pages settings: it
      # returns the github.io URL until a custom domain is saved, and http://
      # until "Enforce HTTPS" is ticked — both of which end up baked into every
      # canonical tag and sitemap entry of whatever build runs in between.
      - run: npm run build
        env:
          SITE: https://oasisglobe.in
          BASE: /
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
